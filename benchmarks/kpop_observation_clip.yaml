schema_version: 1
id: kpop_observation_clip
name: K팝 관찰 클립
philosophy:
- 소재 선정
- 시청자가 볼 이유 정의
- 그 이유를 증명하는 장면 선택
- 짧은 제목과 해설
- 자체 디자인으로 렌더
minimum_confidence: 0.65
default_seconds: 30
observation_types:
  discovery:
    description: 놓치기 쉬운 장면이나 포인트 발견
    min_evidence: 1
    question_template: 이 포인트를 발견했나요?
  unexpected_change:
    description: 이전 또는 다른 장면과 달라진 점
    min_evidence: 2
    distinct_perspectives: true
    question_template: 어떤 변화가 가장 눈에 띄나요?
  comparison:
    description: 같은 곡의 다른 무대나 다른 멤버 비교
    min_evidence: 2
    distinct_perspectives: true
    question_template: 어떤 버전이 더 좋아요?
  common_pattern:
    description: 여러 장면에서 확인할 수 있는 공통점
    min_evidence: 2
    distinct_perspectives: true
    question_template: 다른 장면에서도 이 공통점이 보이나요?
  rediscovery:
    description: 과거 장면을 현재 관점에서 다시 보기
    min_evidence: 1
    question_template: 지금 다시 보니 어떤가요?
  evidence_based_reaction:
    description: 실제 장면으로 확인 가능한 강한 인상
    min_evidence: 1
    question_template: 어느 부분이 가장 인상적인가요?
content_structure:
- role: reason_to_watch
  start: 0
  end: 2
- role: first_evidence
  start: 2
  end: 8
- role: comparison_or_interpretation
  start: 8
  end: 22
- role: payoff_or_question
  start: 22
  end: 30
selection_rules:
- claim과 시청 이유를 먼저 정의하고 그 주장에 대한 근거 구간을 한 쌍으로 선택한다.
- 타임코드와 구간별 관찰 내용 및 주장 지지 이유가 없는 하이라이트는 선택하지 않는다.
- 비교와 공통점은 서로 다른 관점의 독립된 근거가 필요하다.
- 확신이 부족하면 선택을 거부한다. confidence는 흥행 예측이 아니라 입력 근거의 편집상 확신이다.
- 프로필에는 구조적 분석만 저장한다. 타 채널 디자인과 미디어는 저장하지 않는다.
source_ids:
- doltori
strategy:
  narration_mode:
  - TTS 없음; 원본 소리 선택
  repeatability:
  - 6개 기존 관찰 variation
  visual_strategy:
  - 자체 브랜딩과 전체 근거 프레임
