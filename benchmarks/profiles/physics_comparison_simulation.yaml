schema_version: 1
id: physics_comparison_simulation
name: 단일 변수 물리 비교
content_type: physics_comparison
adapter: evidence_sequence
minimum_confidence: 0.65
default_seconds: 30
min_seconds: 20
max_seconds: 45
philosophy:
- 소재 선정
- 볼 이유와 질문 정의
- 주장을 증명하는 근거 선택
- 짧은 제목과 해설
- 자체 디자인으로 렌더
observation_types:
  softness:
    description: softness 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  size:
    description: size 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  shape:
    description: shape 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  slope:
    description: slope 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  height:
    description: height 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  material:
    description: material 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  obstacle:
    description: obstacle 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
content_structure:
- role: hook
  start: 0
  end: 2
- role: trials
  start: 2
  end: 26.0
- role: payoff
  start: 26.0
  end: 28.0
- role: ending_question
  start: 28.0
  end: 30.0
evidence_types:
- experiment_result
- comparison
- visual
- clip
evidence_roles:
- trials
source_ids:
- bks_simulation
selection_rules:
- 볼 이유/질문/claim을 먼저 기록하고 확인한 근거를 연결한다.
- 주석 근거의 의미와 진위는 자동 검증하지 않는다.
- 타 채널 디자인/대본 문장/원본을 복제하지 않는다.
strategy:
  scene_structure:
  - 실험 질문 → 고정 환경 → 변수 하나 → 반복 조건 → 차이 → 결과
  title_strategy:
  - 구체 질문 하나를 약속하고 payoff에서 답한다.
  narration_mode:
  - 현재 TTS 없음; 자체 카드/짧은 해설, 권리 확인 영상의 원본 소리 선택
  caption_density:
  - 각 evidence당40자 이내 한 문장
  repeatability:
  - 카메라/조명/장치를 고정하고 변수 하나만 변경; 조건 라벨 유지
  follow_up_strategy:
  - 새 근거가 확인될 때 후속 제작한다.
  visual_strategy:
  - 직접 제작한 실험 영상 비교 편집; Blender 생성 미구현
  pacing:
  - 한 장면 한 근거; 전체 근거를 자르지 않는다.
