schema_version: 1
id: illustrated_fact_explainer
name: 사실과 숫자를 짧게 설명
content_type: fact_explainer
adapter: evidence_cards
minimum_confidence: 0.65
default_seconds: 30
min_seconds: 20
max_seconds: 60
philosophy:
- 소재 선정
- 볼 이유와 질문 정의
- 주장을 증명하는 근거 선택
- 짧은 제목과 해설
- 자체 디자인으로 렌더
observation_types:
  numbers:
    description: numbers 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
  everyday_why:
    description: everyday_why 구조의 확인된 근거를 연결
    min_evidence: 2
    question_template: 제목의 질문에 근거가 답하나요?
content_structure:
- role: hook
  start: 0
  end: 2
- role: context
  start: 2
  end: 14.0
- role: explanation
  start: 14.0
  end: 26.0
- role: payoff
  start: 26.0
  end: 28.0
- role: ending_question
  start: 28.0
  end: 30.0
evidence_types:
- fact
- comparison
- multiple_examples
evidence_roles:
- context
- explanation
source_ids:
- factory_reference
selection_rules:
- 볼 이유/질문/claim을 먼저 기록하고 확인한 근거를 연결한다.
- 주석 근거의 의미와 진위는 자동 검증하지 않는다.
- 타 채널 디자인/대본 문장/원본을 복제하지 않는다.
strategy:
  scene_structure:
  - 생활 질문/숫자 → 기준/배경 → 확인한 설명 → 기억할 답
  title_strategy:
  - 구체 질문 하나를 약속하고 payoff에서 답한다.
  narration_mode:
  - 현재 TTS 없음; 자체 카드/짧은 해설, 권리 확인 영상의 원본 소리 선택
  caption_density:
  - 각 evidence당40자 이내 한 문장
  repeatability:
  - 소재만 바꾸고 동일 구조로 반복한다.
  follow_up_strategy:
  - 새 근거가 확인될 때 후속 제작한다.
  visual_strategy:
  - 자체 카드; 이라스토야 그림/브랜드 복제 없음
  pacing:
  - 한 장면 한 근거; 전체 근거를 자르지 않는다.
