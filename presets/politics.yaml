id: politics
name: 정치 이슈
description: 정치·사회 이슈를 중립적으로 요약하는 뉴스 브리핑 쇼츠
tone: 차분하고 중립적인 앵커 톤. 존댓말. 감정적 표현 금지.
script_rules: |
  - 반드시 보도된 사실만 다룬다. 특정 정당·인물을 옹호하거나 비난하는 표현 금지.
  - 쟁점이 있으면 양측 입장을 각각 한 문장씩 균형 있게 소개한다.
  - 출처 매체를 최소 한 번 언급한다 (예: "연합뉴스에 따르면").
  - 훅은 "오늘 국회에서는 ~", "○○ 논란, 핵심만 정리해 드립니다" 같은 브리핑형.
  - 마지막은 "앞으로의 쟁점은 ~입니다" 같은 전망형 중립 마무리.
visual_mode: broll
image_style: clean news graphic illustration, flat design, navy and white palette, government building silhouettes, no real person likeness, no text
voice:
  edge: ko-KR-InJoonNeural
bgm: news_bed.mp3
subtitle:
  enabled: true   # false 면 하단 자막 없이 만든다 (화면 ③ 에서 잡마다 바꿀 수 있음)
  size: 74
  highlight: "#4DA3FF"
  outline: "#000000"
research_queries_suffix: 뉴스
