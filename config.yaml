# 기본 설정. 웹 UI 옵션이 이 값을 덮어씁니다.
source_policy: strict
my_channels: []  # 채널 일치만으로 권리 허용되지 않음. 개별 파일 증빙 필요.

llm:
  # claude  : Claude Code 로그인(구독) 사용, API 키 불필요. 모델: claude-opus-5 | claude-sonnet-5 | claude-haiku-4-5
  # openai  : OPENAI_API_KEY 필요. 모델: gpt-5 | gpt-5-mini | gpt-4.1 | gpt-4.1-mini
  # anthropic: ANTHROPIC_API_KEY 로 직접 호출
  provider: claude
  model: claude-opus-5
  claude_model: claude-opus-5  # OpenAI에서 구독/auto 모드로 바꿀 때 사용
  effort: medium              # low | medium | high
  openai_model: gpt-5-mini    # UI 에서 GPT 를 고르면 쓰는 모델
  allow_paid_openai: false    # API 키만으로 과금하지 않는다. 명시적 허용 뒤에만 true
  allow_paid_anthropic: false

tts:
  provider: edge              # edge(무료) | openai | elevenlabs | typecast
  # provider별 목소리 기본값 (프리셋에서 덮어쓸 수 있음)
  voices:
    edge: ko-KR-SunHiNeural   # 여성. 남성: ko-KR-InJoonNeural, ko-KR-HyunsuMultilingualNeural
    openai: nova              # alloy, echo, fable, onyx, nova, shimmer
    elevenlabs: ""            # ElevenLabs voice_id
    typecast: ""              # Typecast voice_id
  rate: "+5%"                 # edge-tts 속도

images:
  # none         : AI 생성 안 함. 권리 확인된 첨부 파일 + 대체 카드 사용 (0원)  ← 기본
  #                Flow/Gemini 앱에서 무료로 만든 이미지를 첨부하는 방식
  # 장당 비용 (환율 1450원 기준)
  #   fal          : FLUX schnell        약 4원    (FAL_KEY)
  #   gemini-lite  : Nano Banana 2 Lite  약 49원   (GEMINI_API_KEY)
  #   gemini       : Nano Banana 2       약 97원
  #   gemini-pro   : Nano Banana Pro     약 194원  복잡한 구도용
  #   huggingface  : FLUX schnell        무료·한도 (HF_TOKEN)
  #   openai       : gpt-image           수십~수백 원
  #   pollinations : 키 불필요 무료지만 저화질+워터마크 (최후의 수단)
  provider: none
  image_size: "1K"            # Gemini 전용: 1K | 2K | 4K (클수록 비쌈)
  width: 1080
  height: 1920
  retries: 2

video:
  width: 1080
  height: 1920
  fps: 30
  transition: 0.4             # 장면 전환(초)
  scene_gap: 0.25             # 장면 사이 무음(초)
  target_seconds: 55          # 대본 목표 길이
  bgm_volume: 0.10            # 0~1
  broll_source_volume: 0.12   # 짜깁기 모드에서 원본 영상 소리 크기 (나레이션은 1.0)
  broll_max_sources: 4        # 내려받을 소스 영상 최대 개수
  broll_max_per_source: 15    # 한 소스에서 쓸 수 있는 총 길이(초)
  font: "Malgun Gothic"       # assets/fonts 에 otf/ttf 넣으면 해당 폰트명 사용 가능

sources:
  # Source Resolver: 장면 화면에 쓸 공개 영상·사진 자동 탐색 (make --visuals auto, 기본)
  # 자동으로 화면에 쓰는 것은 CC0 · 퍼블릭 도메인 · CC BY(출처 표기) · NASA 제작 자료 · Pexels/Pixabay(키 있을 때)뿐.
  # YouTube·CC BY-SA·NC·ND·표기 없음은 참고만 한다.
  providers: [openverse, wikimedia_commons, nasa, pexels, pixabay]   # pexels/pixabay 는 PEXELS_API_KEY / PIXABAY_API_KEY 가 있을 때만
  contact: "https://github.com/young92133-cmd/ai-shorts"   # 공개 API User-Agent 연락처 (Wikimedia 정책상 필요)
  max_file_mb: 80          # 자료 한 개 최대 크기
  min_score: 60            # 장면 적합도 내부 점수(0~100) 기준
  min_visual_fit: 7        # 장면과 화면이 맞는 정도(0~10) 최소값
  per_query: 4             # 제공처별 검색 결과 수

carousel:
  # 카드뉴스 · 인스타툰 · 하이브리드 (make --format card_news|insta_toon|hybrid|all). 1080x1350 PNG
  pages: 8                 # 기본 장수 (6~10)
  character: tory_01       # 인스타툰 기본 캐릭터 (characters/<id>/bible.json)
  image_search: true       # 카드 사진을 Source Resolver 로 찾기 (권리 확인되는 공개 자료만). false 면 그래픽 카드
  max_images: 4            # 사진을 찾을 최대 페이지 수
  # 캐릭터 컷 그림: none = 앱이 직접 그리는 마스코트(무료, 기본). gemini-lite 등을 넣으면 AI 생성(유료, 캐시됨)
  image_provider: none
  templates:               # 형식별 기본 템플릿
    card_news: clean_info
    insta_toon: comic_hybrid
    hybrid: comic_hybrid

paths:
  output: output
  presets: presets
  assets: assets
