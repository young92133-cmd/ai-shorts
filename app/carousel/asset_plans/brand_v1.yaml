  - {id: studio_room_day, tags: [원룸, 자취방, 방, 집], mood: day, prompt: "a small cozy Korean studio apartment (one-room) in daytime, bed, desk, window with sunlight"}
  - {id: studio_room_night, tags: [원룸 밤, 자취방 밤, 밤, 방 밤], mood: night, prompt: "a small Korean studio apartment at night, desk lamp on, city lights outside the window, blue tones"}
  - {id: living_room_night, tags: [거실, 집 밤, 소파], mood: night, prompt: "a Korean apartment living room at night, sofa, TV, warm lamp light and dark blue window"}
