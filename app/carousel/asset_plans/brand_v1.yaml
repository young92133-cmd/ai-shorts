  - {id: chart_screen_room, tags: [주식, 투자, 차트, 모니터], mood: night, prompt: "a dark room with multiple monitors showing abstract line charts without numbers"}
  - {id: city_night, tags: [도시, 야경, 서울], mood: night, prompt: "Seoul city skyline at night with apartment lights, seen from a hill"}
  - {id: moving_boxes, tags: [이사, 이삿짐, 새집], mood: day, prompt: "an empty new apartment room with moving boxes stacked, bright daylight"}
  - {id: rainy_window, tags: [우울, 비, 걱정], mood: gloomy, prompt: "a window with rain drops, gloomy grey evening, small room interior"}
  - {id: wallet_receipts, tags: [지갑, 영수증, 가계부, 지출], mood: day, prompt: "a top-down view of a desk with an open wallet, coins and blank receipts"}

personas:   # 경제 의인화 캐릭터 (햄토리치 그림체). 컷에서 'tag:물가' 로 부르면 승인된 이 그림을 쓴다 (없으면 앱이 그린 이름표 캐릭터)
  - id: persona_price_01
    tag: 물가
    name: 물가
    role: 계속 오르려는 장난꾸러기 물가
    look: "a round red price-tag shaped little creature with a small string loop on its head, tiny arms and legs, mischievous face, no text on the tag"
    poses:
      - {id: confident_smug, emotion: confident, pose: arms_crossed, prompt: "smug grin, arms crossed, floating slightly upward"}
      - {id: happy_rising, emotion: happy, pose: cheering, prompt: "jumping up happily with both arms raised"}
      - {id: surprised, emotion: surprised, pose: standing, prompt: "caught off guard, wide eyes"}
  - id: persona_salary_01
    tag: 월급
    name: 월급
    role: 늘 부족한 월급 봉투
    look: "a cute pale-green paper pay envelope creature with a few banknotes peeking out of the top, tiny arms and legs, no text"
    poses:
      - {id: sad, emotion: sad, pose: standing, prompt: "thin and tired, apologetic sad face"}
      - {id: happy, emotion: happy, pose: waving, prompt: "plump and happy on payday, waving"}
      - {id: worried, emotion: worried, pose: shrug, prompt: "nervous, sweating, shrugging"}
  - id: persona_rate_01
    tag: 금리
    name: 금리
    role: 오르락내리락하는 금리
    look: "a navy blue percent-sign shaped creature (the % symbol as a body with two round circles as cheeks), tiny arms and legs, wearing a small banker's bow tie"
    poses:
      - {id: confident, emotion: confident, pose: pointing, prompt: "pointing upward confidently, serious face"}
      - {id: angry, emotion: angry, pose: arms_crossed, prompt: "stern frown, arms crossed"}
      - {id: thinking, emotion: thinking, pose: chin, prompt: "thinking with a hand on the chin"}
