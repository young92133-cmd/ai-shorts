# 햄토리치 브랜드 그림 1차 세트 (2026-10-08). `python -m app.factory characters generate --plan brand_v1`
# 캐릭터는 순백 배경으로 만든 뒤 앱이 배경을 지워 투명 PNG 로 등록한다. 배경 그림에는 인물·글자를 넣지 않는다.
# 모든 캐릭터 그림은 마스터 시트를 참조 이미지로 함께 보낸다. 결과는 사람이 시트와 대조한 뒤 쓴다.
version: brand_v1
style: >-
  soft hand-drawn Korean character illustration, warm brown outlines, fluffy watercolor-like fur texture,
  pastel palette (golden brown #DA9455, cream #FBEDD4, navy #3C4D65, mint #9FC4A6, peach #FBAC99)
character_suffix: >-
  Full body, centered, generous empty margin around the character, plain pure white background (#FFFFFF),
  no shadow on the ground, no text, no letters, no speech bubbles, no frame.
background_suffix: >-
  Background scene only, no people, no animals, no characters, no text, no letters, no signs with writing,
  no logos, slightly simplified shapes and soft lighting so a cartoon character can stand in front, portrait 4:5.

poses:   # 햄토리치 추가 표정·자세 → characters/hamtorich_01/poses/
  - {id: surprised_round_mouth, emotion: surprised, pose: standing, also_poses: [waving],
     prompt: "eyes wide open and round, small round open 'O' mouth, both paws raised at shoulder height in shock"}
  - {id: happy_eyes_closed, emotion: happy, pose: cheering, also_emotions: [confident],
     prompt: "eyes closed in happy upward arcs (^ ^), big open smile, both paws at puffed cheeks, joyful"}
  - {id: thinking_question, emotion: thinking, pose: chin, also_poses: [thinking],
     prompt: "neutral closed mouth, eyes looking up and to the side, one paw on chin, pondering"}
  - {id: sad_teary, emotion: sad, pose: standing,
     prompt: "teary eyes with small tears, drooping ears, small frown, paws held together in front of belly"}
  - {id: angry_puffed, emotion: angry, pose: arms_crossed,
     prompt: "puffed cheeks, frowning eyebrows, arms crossed, annoyed but cute"}
  - {id: shocked_scream, emotion: surprised, pose: shrug, also_emotions: [worried],
     prompt: "screaming in shock with mouth wide open, both paws pressed on cheeks, ears straight up"}
  - {id: happy_money, emotion: happy, pose: holding_money, also_emotions: [confident],
     prompt: "holding a small stack of banknotes in both paws, proud happy smile"}
  - {id: happy_house_key, emotion: happy, pose: holding_key,
     prompt: "holding up a golden house key with a small house keychain, excited smile"}
  - {id: thinking_calculator, emotion: thinking, pose: calculator, also_poses: [explaining],
     prompt: "holding a calculator and pressing buttons, focused serious face"}
  - {id: worried_receipt, emotion: worried, pose: receipt, also_emotions: [sad],
     prompt: "holding a very long paper receipt that drapes to the floor, worried sweating face"}
  - {id: worried_running, emotion: worried, pose: running,
     prompt: "running in a hurry, leaning forward, one paw holding the tie, flustered face"}
  - {id: sad_exhausted, emotion: sad, pose: slumped,
     prompt: "slumped shoulders, half-closed tired eyes, exhausted after work"}
  - {id: happy_satchel_book, emotion: happy, pose: waving, also_emotions: [neutral],
     prompt: "the master sheet front pose: waving one paw, holding a green book, brown satchel with a gold house keychain across the body"}

cast:   # 조연 캐릭터 (햄토리치와 같은 그림체) → characters/<id>/
  - id: daram_01
    name: 다람
    role: 햄토리치의 친구. 충동구매·월급 탕진이 잦은 사회초년생 다람쥐
    look: "a chubby red-brown squirrel with a big fluffy striped tail, wearing an oversized beige hoodie and white sneakers"
    poses:
      - {id: happy_shopping, emotion: happy, pose: holding_bags, prompt: "holding many shopping bags, very happy"}
      - {id: worried_wallet, emotion: worried, pose: standing, prompt: "looking into an empty wallet, worried"}
      - {id: surprised, emotion: surprised, pose: standing, prompt: "shocked with wide eyes and open mouth"}
      - {id: sad_crying, emotion: sad, pose: standing, prompt: "crying with tears, paws on face"}
  - id: landlord_cat_01
    name: 냥주인
    role: 집주인 고양이. 계약 조건을 깐깐하게 따지는 역할 (악역이 아니라 상대 입장)
    look: "a plump grey tabby cat with round glasses, wearing a brown cardigan, holding a clipboard"
    poses:
      - {id: neutral_clipboard, emotion: neutral, pose: standing, prompt: "holding a clipboard, calm business face"}
      - {id: confident_smug, emotion: confident, pose: arms_crossed, prompt: "arms crossed with a confident smug smile"}
      - {id: angry, emotion: angry, pose: pointing, prompt: "annoyed, pointing one paw forward"}
      - {id: happy, emotion: happy, pose: waving, prompt: "friendly smile, waving"}
  - id: owl_banker_01
    name: 부엉 대리
    role: 은행원 부엉이. 금리·대출 조건을 설명하는 전문가
    look: "a round white-and-brown owl with small round glasses, wearing a light grey suit vest and a navy tie"
    poses:
      - {id: explaining, emotion: confident, pose: explaining, prompt: "explaining with one wing raised like pointing"}
      - {id: thinking, emotion: thinking, pose: chin, prompt: "thinking with a wing on the chin"}
      - {id: happy, emotion: happy, pose: standing, prompt: "warm smile, wings together"}
      - {id: surprised, emotion: surprised, pose: standing, prompt: "surprised with wide eyes, feathers puffed"}

