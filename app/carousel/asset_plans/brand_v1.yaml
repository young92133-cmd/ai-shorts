  - {id: realestate_office, tags: [부동산, 중개사무소, 공인중개사], mood: day, prompt: "a small Korean real estate agency office interior, desk, chairs, listing boards with only blank cards"}
  - {id: contract_table, tags: [계약, 계약서, 상담], mood: day, prompt: "a close view of a table with blank contract papers, a pen and a stamp, warm light"}
  - {id: bank_counter, tags: [은행, 창구, 대출 상담], mood: day, prompt: "a Korean bank counter interior, teller desk, waiting chairs, clean bright light"}
  - {id: office_desk, tags: [회사, 사무실, 직장], mood: day, prompt: "a modern Korean office with desks and monitors, daytime"}
  - {id: office_night, tags: [야근, 사무실 밤, 회사 밤], mood: night, prompt: "an empty office at night, one desk lamp and monitor glowing, dark windows"}
  - {id: supermarket_checkout, tags: [마트, 장보기, 계산대, 장바구니], mood: day, prompt: "a Korean supermarket checkout counter with a shopping cart full of groceries"}
  - {id: convenience_store, tags: [편의점], mood: night, prompt: "a Korean convenience store interior at night, bright shelves and fridge"}
  - {id: cafe, tags: [카페, 커피], mood: day, prompt: "a cozy cafe interior with wooden tables and coffee cups, window light"}
