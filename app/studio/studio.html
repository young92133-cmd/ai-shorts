<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드뉴스 스튜디오</title>
<style>
:root { --bg:#f6f7fb; --panel:#fff; --line:#e3e6ee; --text:#1d2230; --muted:#6b7385; --accent:#3b6cff; --accent-ink:#fff; --err:#d64545; --ok:#1f9d55; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3b; --text:#e8eaf0; --muted:#8b93a7; --accent:#6b8cff; --accent-ink:#0f1115; --err:#ff6b6b; --ok:#4cd37b; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
.app { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow:auto; }
aside h1 { font-size:17px; margin:0 0 12px; }
aside a.back { color:var(--muted); font-size:13px; text-decoration:none; display:block; margin-bottom:14px; }
.proj { display:flex; gap:8px; align-items:center; padding:6px; border-radius:8px; cursor:pointer; margin-bottom:4px; }
.proj:hover, .proj.on { background:var(--bg); }
.proj img, .proj .ph { width:36px; height:45px; object-fit:cover; border-radius:4px; background:var(--line); flex:none; }
.proj small { color:var(--muted); display:block; font-size:11px; }
.proj span { font-size:13px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
main { padding:20px 24px; min-width:0; }
.box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
label { display:block; font-weight:600; font-size:13px; margin:12px 0 4px; }
input[type=text], textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
textarea { min-height:64px; resize:vertical; }
.row { display:flex; gap:12px; flex-wrap:wrap; } .row > div { flex:1; min-width:140px; }
.seg { display:flex; gap:6px; flex-wrap:wrap; } .seg button { flex:1; }
button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
button.primary, .seg button.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
.hint { color:var(--muted); font-size:13px; } .err { color:var(--err); } .ok { color:var(--ok); }
.log { font:12px/1.5 Consolas,monospace; background:var(--bg); border-radius:8px; padding:10px; max-height:220px; overflow:auto; white-space:pre-wrap; }
.strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
.strip .th { flex:none; width:84px; cursor:pointer; text-align:center; font-size:11px; color:var(--muted); }
.strip img { width:84px; height:105px; object-fit:cover; border-radius:6px; border:2px solid transparent; display:block; }
.strip .th.on img { border-color:var(--accent); }
.work { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,380px); gap:16px; align-items:start; }
.preview img { width:100%; max-width:540px; border-radius:10px; border:1px solid var(--line); display:block; }
.panel-ed { border-top:1px dashed var(--line); margin-top:12px; padding-top:4px; }
.top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; } .top h2 { flex:1; margin:0; font-size:18px; min-width:200px; }
@media (max-width:860px) { .app { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); max-height:220px; } .work { grid-template-columns:1fr; } main { padding:16px; } }
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>카드뉴스 스튜디오</h1>
  <a class="back" href="/">← 쇼츠 화면으로</a>
  <button class="primary" style="width:100%;margin-bottom:12px" onclick="showCreate()">+ 새로 만들기</button>
  <div class="hint" style="margin-bottom:6px">최근 작업</div>
  <div id="projects"></div>
</aside>
<main>
  <!-- 1. 만들기 -->
  <section id="v-create">
    <div class="box">
      <label for="topic">주제</label>
      <textarea id="topic" placeholder="예: 10월 소비자물가 상승률, 사회초년생이 알아야 할 것"></textarea>
      <label>형식</label>
      <div class="seg" id="fmt">
        <button data-v="card_news" class="on">카드뉴스</button><button data-v="insta_toon">인스타툰</button><button data-v="hybrid">섞기(카드+만화)</button>
      </div>
      <div class="row">
        <div><label for="pages">장수</label><select id="pages"></select></div>
        <div><label for="template">템플릿</label><select id="template"><option value="">형식 기본값</option></select></div>
        <div><label for="character">캐릭터</label><select id="character"><option value="">기본 캐릭터</option></select></div>
      </div>
      <label><input type="checkbox" id="imgsearch" checked> 공개 사진 찾기 (권리 확인되는 것만, 무료)</label>
      <label for="instructions">추가 요청 (선택)</label>
      <textarea id="instructions" placeholder="예: 20대 직장인 눈높이로, 숫자는 크게"></textarea>
      <p class="hint">문구는 Claude 구독으로 쓰고, 그림은 등록된 캐릭터 포즈·앱이 그린 배경·공개 사진을 씁니다(유료 이미지 생성 없음).</p>
      <button class="primary" id="go" onclick="create()">만들기</button>
      <span id="create-msg" class="hint"></span>
    </div>
    <div class="box" id="progress" hidden>
      <strong id="prog-title">만드는 중…</strong> <span class="hint">(보통 1~3분)</span>
      <div class="log" id="prog-log"></div>
    </div>
  </section>

  <!-- 2. 미리보기 · 수정 · 저장 -->
  <section id="v-project" hidden>
    <div class="top">
      <h2 id="p-title"></h2>
      <button onclick="exportZip()">PNG 전부 저장 (ZIP)</button>
      <button onclick="copyCaption()">캡션 복사</button>
    </div>
    <p class="hint" id="p-msg"></p>
    <div class="box"><div class="strip" id="strip"></div></div>
    <div class="work">
      <div class="box preview"><img id="big" alt="선택한 카드"></div>
      <div class="box">
        <strong id="ed-title"></strong>
        <div id="editor"></div>
        <div class="row" style="margin-top:14px">
          <button class="primary" id="save" onclick="savePage()">저장하고 다시 그리기</button>
          <button id="vary" onclick="vary()" title="감정·자세·배경을 다음 후보로 바꿔 다시 그립니다">장면 바꾸기</button>
        </div>
        <p class="hint" id="ed-msg"></p>
      </div>
    </div>
  </section>
</main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let P = null, cur = 1, fmt = "card_news";

async function api(url, opt = {}) {
  const r = await fetch(url, {headers: {"Content-Type": "application/json"}, ...opt});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
const fileUrl = (pid, f, v) => `/api/studio/files/${pid}/${f}${v ? "?v=" + v : ""}`;

async function init() {
  const c = await api("/api/studio/choices");
  $("pages").innerHTML = c.pages.map(n => `<option ${n === 8 ? "selected" : ""}>${n}</option>`).join("");
  $("template").innerHTML += c.templates.map(t => `<option value="${esc(t.id)}">${esc(t.name || t.id)}</option>`).join("");
  $("character").innerHTML += c.characters.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
  document.querySelectorAll("#fmt button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#fmt button").forEach(x => x.classList.toggle("on", x === b)); fmt = b.dataset.v; });
  await loadProjects();
}

async function loadProjects() {
  const list = await api("/api/studio/projects");
  const name = {card_news: "카드뉴스", insta_toon: "인스타툰", hybrid: "섞기"};
  $("projects").innerHTML = list.map(p => `<div class="proj ${P && P.project_id === p.project_id ? "on" : ""}" onclick="openProject('${p.project_id}')">
      ${p.thumb ? `<img src="${fileUrl(p.project_id, p.thumb.replace("/", "/"))}" alt="">` : `<div class="ph"></div>`}
      <div><small>${name[p.format] || p.format} · ${esc(p.created.slice(5, 16))}${p.status === "failed" ? " · 실패" : ""}</small><span>${esc(p.topic)}</span></div></div>`).join("")
    || `<p class="hint">아직 없습니다.</p>`;
}

function showCreate() { $("v-create").hidden = false; $("v-project").hidden = true; P = null; loadProjects(); }

async function create() {
  $("create-msg").textContent = ""; $("create-msg").className = "hint";
  const body = {topic: $("topic").value, format: fmt, pages: +$("pages").value, template: $("template").value,
                character: $("character").value, image_search: $("imgsearch").checked, instructions: $("instructions").value};
  let t;
  try { t = await api("/api/studio/projects", {method: "POST", body: JSON.stringify(body)}); }
  catch (e) { $("create-msg").textContent = e.message; $("create-msg").className = "err"; return; }
  $("go").disabled = true; $("progress").hidden = false; $("prog-title").textContent = "만드는 중…";
  while (true) {
    await new Promise(r => setTimeout(r, 1500));
    t = await api(`/api/studio/tasks/${t.id}`);
    $("prog-log").textContent = t.log.join("\n"); $("prog-log").scrollTop = 1e9;
    if (t.status !== "running") break;
  }
  $("go").disabled = false;
  if (t.status === "done") { $("progress").hidden = true; await loadProjects(); openProject(t.result.project_id); }
  else { $("prog-title").textContent = "실패: " + ((t.result && t.result.message) || "알 수 없는 오류"); await loadProjects(); }
}

async function openProject(pid, page = 1) {
  try { P = await api(`/api/studio/projects/${pid}`); }
  catch (e) { alert(e.message); return; }
  $("v-create").hidden = true; $("v-project").hidden = false;
  $("p-title").textContent = P.title || P.topic; $("p-msg").textContent = "";
  cur = Math.min(page, P.pages.length); drawStrip(); select(cur); loadProjects();
}

function drawStrip() {
  $("strip").innerHTML = P.pages.map(p => `<div class="th ${p.page === cur ? "on" : ""}" onclick="select(${p.page})">
     <img src="${fileUrl(P.project_id, p.file, p.version)}" alt="${p.page}장">${p.page}${p.fallback_used ? " ⚠" : ""}</div>`).join("");
}

const opt = (list, v) => list.map(x => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("")
  + (v && !list.includes(v) ? `<option selected>${esc(v)}</option>` : "");
const field = (key, label, v, area) => `<label>${label}</label>` + (area
  ? `<textarea data-k="${key}">${esc(v)}</textarea>` : `<input type="text" data-k="${key}" value="${esc(v)}">`);

function select(n) {
  cur = n; const p = P.pages[n - 1], d = p.data, o = P.options;
  $("big").src = fileUrl(P.project_id, p.file, p.version); drawStrip();
  $("ed-title").textContent = `${n}장 · ${p.type}`; $("ed-msg").textContent = p.fallback_used ? "⚠ 이 장은 대체 레이아웃으로 그려졌습니다. 문구를 줄여 보세요." : "";
  let h = "";
  if (p.kind === "card") {
    h += field("headline", "제목", d.headline) + field("body", "본문", d.body, true);
    if (d.items && d.items.length || ["checklist", "summary"].includes(p.type)) h += field("items", "항목 (한 줄에 하나)", (d.items || []).join("\n"), true);
    h += field("label", "작은 태그", d.label) + field("emphasis", "강조할 단어·숫자", d.emphasis);
  } else {
    h += field("headline", "상단 캡션", d.headline) + field("caption", "하단 설명", d.caption, true);
    d.panels.forEach((b, k) => {
      h += `<div class="panel-ed" data-panel="${k}"><strong>${k + 1}컷</strong>` + field("dialogue", "대사", b.dialogue, true)
        + (b.partner ? field("partner_dialogue", "상대 대사", b.partner_dialogue) : "")
        + `<div class="row"><div><label>감정</label><select data-k="emotion">${opt(o.emotions, b.emotion)}</select></div>
           <div><label>자세</label><select data-k="pose">${opt(o.poses, b.pose)}</select></div></div>
           <div class="row"><div><label>배경</label><select data-k="background">${opt(o.backgrounds, b.background)}</select></div>
           <div><label>카메라</label><select data-k="camera">${opt(o.cameras, b.camera)}</select></div></div>`
        + field("sfx", "효과음 (예: 헉!)", b.sfx) + `</div>`;
    });
  }
  $("editor").innerHTML = h;
}

function collect() {
  const f = {}, read = el => el.dataset.k === "items" ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value;
  $("editor").querySelectorAll(":scope > [data-k]").forEach(el => f[el.dataset.k] = read(el));
  const panels = [...$("editor").querySelectorAll("[data-panel]")].map(div => {
    const o = {}; div.querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.value); return o; });
  if (panels.length) f.panels = panels;
  return f;
}

async function busy(fn) {
  $("save").disabled = $("vary").disabled = true; $("ed-msg").textContent = "다시 그리는 중…";
  try { await fn(); await openProject(P.project_id, cur); $("ed-msg").innerHTML = `<span class="ok">${cur}장을 다시 그렸습니다.</span>`; }
  catch (e) { $("ed-msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally { $("save").disabled = $("vary").disabled = false; }
}
const savePage = () => busy(() => api(`/api/studio/projects/${P.project_id}/pages/${cur}`, {method: "POST", body: JSON.stringify({fields: collect()})}));
const vary = () => busy(() => api(`/api/studio/projects/${P.project_id}/pages/${cur}/vary`, {method: "POST"}));

async function exportZip() {
  try {
    const r = await api(`/api/studio/projects/${P.project_id}/export`, {method: "POST"});
    $("p-msg").innerHTML = `저장했습니다: <a href="${fileUrl(P.project_id, r.file)}">ZIP 내려받기</a> · <span class="hint">${esc(r.path)}</span>`;
  } catch (e) { $("p-msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function copyCaption() {
  try { await navigator.clipboard.writeText(P.caption); $("p-msg").textContent = "캡션을 복사했습니다."; }
  catch { $("p-msg").textContent = "복사하지 못했습니다. caption.txt 를 열어 주세요."; }
}
init();
</script>
</body>
</html>
