name: 뇌전구형 이슈 속보
title_bar: true
hook_pattern: '첫 문장은 제목을 거의 그대로 읽는다. 제목 공식은 ''[오늘자/결국/이제야/갑자기] + 자극적인 행동·결과 + ~다는/~한 이유/~하니까 생긴 일 + 인물 별명''(예: ''오늘자 잠적했다는 ○○ 만점자'', ''○○가 자수하니까 큰일난 사람들'', ''○○를 끝까지 기다리면 안 되는 이유''). 둘째 문장에서 바로 배경을 한 줄로 요약한다(''여기저기 방송에 나오던 ○○.'', ''한 달 전만 해도 ~했는데'').'
structure: ① 제목 읽기(0~2초) → ② 배경 한 줄 요약(2~6초) → ③ 핵심 증거를 대사처럼 재연 — 캡처·발언·댓글을 따옴표 없이 그대로 읽어 주고('이게 뭐예요?' → '집에서 끄적였나 보죠') 그 사이에 짧은 전달 문장 → ④ '그러나/근데 알고 보니/그러다'로 반전 하나 → ⑤ 반전의 구체 근거(숫자·날짜·기관 이름) → ⑥ 비꼬는 한 줄 마무리. 한 편에 사건 한 조각만 다루고, 같은 사건의 다음 조각은 다음 편으로 넘긴다(시리즈).
emotional_arc: 호기심(제목) → '어? 진짜?'(증거) → 반전의 소름·어이없음 → 피식 웃는 비꼼으로 끝
tone: 커뮤니티 썰 전달체 반말. 문장 끝은 '~했다고 함', '~거임', '~라고', '~했다는데'를 돌려 쓴다. 해설자 1인칭은 없고, 시청자 속마음 같은 짧은 추임새('아니 도망쳤나?', '했네 했어', '진짜 인정했다고?')를 2~3번 끼운다. 커뮤니티 표현(빤스런, 떼돈, 큰일난, 극대노, 파묘)은 제목과 본문에 1~2개만.
sentence_style: 한 문장 15~30자의 짧은 끊어 읽기. 나레이션이 처음부터 끝까지 쉬지 않고 이어진다(원본 소리·침묵 없음). 숫자·날짜·기관명은 구체적으로 쓴다(1년 보관, 오전 8시, 산업인력공단). 확인되지 않은 부분은 '~라는 말이 나옴', '~라는 의혹'처럼 전달형으로만 쓰고 사실처럼 단정하지 않는다.
pacing: 45~55초(약 200~230자). 장면 8~12개, 한 장면 2~3초로 빠르게 넘긴다(장면 하나 = 문장 하나 = 화면 하나). 화면은 인물 사진 대신 증거 캡처·기사 헤드라인·기관 건물·물건 사진·상황 재연 이미지를 번갈아 쓴다.
cta: 구독·좋아요 요청 없음. 마지막 문장은 비꼬는 한 줄 추측이나 감상으로 끝낸다('이러다 대장내시경도 추가하는 거 아니야?', '세상 진짜 뻘쭘하겠네', '진짜 소름 돋네'). 결론을 정리하지 않고 다음 편이 궁금하게 끝낸다.
notes: |-
  - 화면: 위쪽 검은 띠에 2줄 제목을 영상 내내 고정(1줄 흰색 = 맥락, 2줄 노란색 = 인물·핵심). 아래쪽 큰 흰 자막, 강조 단어는 노란색.
  - 소재: 지금 커뮤니티·뉴스에서 뜨는 사건 하나를 잡아 '도망침 → 해명 → 과거 → 돈 → 후속' 식으로 여러 편으로 쪼갠다. 특정 인물이 제목에 들어간 편이 일반 주제 편보다 훨씬 잘 됐다(중앙값 약 9배).
  - 인물은 실명 대신 별명(○○ 만점자, ○○냥이)으로 부르고, 외모 평가·사생활 추정·범죄 단정은 하지 않는다. 보도·당사자 발언·공개 게시물로 확인된 것만 사실처럼 말한다.
  - 실존 인물의 얼굴을 AI로 만들지 않는다(딥페이크·명예훼손 위험). AI 이미지는 시험장 풍경·초소형 카메라 같은 상황 재연에만, 인물은 뒷모습·실루엣·손으로 처리한다. 실제처럼 보이는 합성 화면을 쓰면 업로드할 때 유튜브 '변경 또는 합성 콘텐츠'를 표시한다.
  - 설명란: 제목 한 줄 + 참고한 기사·게시물 출처. 해시태그는 사건 키워드 2~3개 + #이슈 #근황.
