id: style-f8b83e20
name: 건축매니아 자문자답 원리 해설형
hook_pattern: '첫 문장은 ''누구나 들어봤을 통념'' 또는 ''멀리서 본 첫인상''을 단정형으로 제시하고, 2~3문장 안에 그것과 어긋나는 사실이나 숫자를 붙인 뒤, ''왜/과연 ~일까요?''라는 질문으로 마무리한다. 통념 제시 → 반전 사실 → 핵심 질문의 3단이 첫 3~4문장에 모두 들어가야 한다. 예시: ''흔히 아파트는 지은지 100년이 지나면 무너진다고들 합니다. 콘크리트에도 우유처럼 정해진 유통 기한이 있다는 건데요. 과연 100년째 되는 날 멀쩡하던 아파트는 진짜로 와르르 주저앉아 버릴까요?'' / ''멀리서 보면 이음새 하나 없이 이어진 거대한 은빛 곡면이 있습니다. 서울 동대문의 DDP입니다. 그런데 가까이 다가가면 매끈한 표면은 수많은 금속판으로 나뉘어 있죠. 그 수는 무려 45,133장입니다.'''
structure: ① 통념/첫인상 제시 → ② 반전 사실(숫자·비유) → ③ 핵심 질문 던지기 → ④ '답을 찾으려면 ~까지 들어가 봐야 합니다' 식으로 시선을 안쪽/깊은 곳으로 이동 → ⑤ 기본 원리 설명(한 문단) → ⑥ '그렇다면 ~하면 되지 않을까요?'라는 시청자가 떠올릴 법한 쉬운 해법을 제시하고 '하지만/문제는'으로 기각(이 자문자답을 4~7회 반복하며 한 단계씩 깊이 들어감) → ⑦ 진짜 해법 또는 핵심 개념 등장('여기서 발상을 바꿉니다', '이 발상을 담은 방식이 바로 ~입니다') → ⑧ 후속 문제('그런데 ~하자 두 번째 문제가 기다리고 있었습니다') → ⑨ 첫 질문을 그대로 다시 던짐 → ⑩ 'A가 아니라 B인 겁니다' 대조 구문으로 한 문장 결론
tone: 정중한 존댓말 해설체. '~입니다/~죠/~거든요/~는 겁니다' 네 가지 어미를 순환시켜 리듬을 만든다. 감탄사·개인 감정 표현 없음, 1인칭 등장 없음. 유일한 감정 장치는 '무려', '조용히 카운트다운이 돌아가고', '은빛 퍼즐 수만 조각' 같은 과장 없는 비유 한두 개. 시청자를 '우리 아파트', '우리 집'처럼 당사자로 끌어들인다.
sentence_style: 한 문장 평균 20~35자, 한 호흡에 읽히는 단문. 한 장면(한 논점)당 3~5문장. 문단마다 '질문 1문장 → 답 2~3문장 → ~죠/~거든요로 끝나는 보충 1문장' 구조를 지킨다. 전문 용어(탄산화, 중성화, BIM, 다점 신장 성형기)는 등장 직후 반드시 한 문장으로 쉬운 말 풀이나 일상 비유('수천 개의 손가락이 금속판을 밀어주는 것과 비슷합니다')를 붙인다. 구체 숫자(45,133장, 4mm, 2,400개, 33,228㎡)는 반올림하지 않고 정확히 인용한다.
pacing: 4~5분 분량(257초, 300초)의 긴 쇼츠. 논점(장면) 수 12~18개, 장면당 15~25초. 장면 전환은 항상 질문 문장('그렇다면 ~일까요?', '그런데 왜 ~일까요?')이 트리거이며, 질문 직후 화면/시점이 바뀐다(외벽 → 단면 → 철근, 멀리서 → 가까이 → 공장 → 현장). 정보를 한꺼번에 쏟지 않고 한 장면에 개념 하나만 넣어 계단식으로 깊이를 더한다.
cta: '명시적 구독·좋아요 요청 없음. 마무리는 오프닝 질문을 토씨만 바꿔 다시 던진 뒤(''그렇다면 우리 아파트도 100년이 되면 끝일까요?'', ''그렇다면 DDP의 매끈한 곡면을 왜 수만 장으로 잘게 나눴을까요?''), ''A가 아니라 B인 겁니다'' 형태의 한 문장 반전 정의로 끝낸다. 예: ''진짜 비밀은 절대 늙지 않는 콘크리트가 아니라 늙어가는 집을 계속 고쳐 쓸 수 있게 만드는 데 있는 겁니다.'' 결론이 곧 제목의 답이 되도록 설계한다.'
notes: |-
  - 제목은 '질문형 + 숫자/통념'(예: '우리 아파트도 100년이면 끝?', '왜 45,133장으로 나눴을까?')이며 해시태그에 #건축 #지식 #상식 #ai #쇼츠를 고정 사용.
  - 설명란은 영상 훅을 2~3줄로 재서술하고, 비유를 썼을 경우 '~는 비유입니다'라고 면책 문구를 덧붙인다(영상 1). 영상 2는 타임스탬프 챕터를 넣었다.
  - 영상 2는 '문제 → 기각된 대안 3가지(큰 판, 작은 평판, 수작업) → 해결 → 두 번째 문제 → 해결'의 프로젝트 서사가 강하고, 영상 1은 원리 설명이 강하다. 주제가 '건물 하나'면 전자, '현상/원리'면 후자 구조를 택한다.
  - 시각 연출은 디오라마 단면, 3D 모델 등 '겉→속' 줌인 장면을 전제로 대본을 쓴다('외벽을 뚫고 철근까지 들어가 봐야 합니다').
  - 중간에 '유지보수/관리 측면의 반론'을 한 번 넣어 반박하는 장면이 두 영상 모두에 있다(균열 하나 보이면 위험? / 패널이 다 다르면 관리 어렵지 않나?).
